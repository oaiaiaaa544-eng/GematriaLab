name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble, verify and extract project
        run: |
          cat source-part-*.b64 > source.tar.xz.b64
          test "$(wc -c < source.tar.xz.b64)" -eq 22348
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "72bc666af6e59770ac6438b8b2eab5c3cd66b19ebd780a05293ca5dfbf8cdcf7  source.tar.xz" | sha256sum -c -
          tar -xJf source.tar.xz
          test -f GematriaLabAndroid/app/src/main/assets/index.html

      - name: Apply GematriaLab 1.2 design and calculator patch
        run: |
          cat gematria-patch-v1.2-*.b64 > /tmp/gematria-patch.b64
          test "$(wc -c < /tmp/gematria-patch.b64)" -eq 15324
          base64 --decode /tmp/gematria-patch.b64 > /tmp/gematria-patch.xz
          echo "9d884efe6287cbe616a7643178ebec79b6bfc42fc81998e53037072c20e30970  /tmp/gematria-patch.xz" | sha256sum -c -
          xz -dc /tmp/gematria-patch.xz | patch -p1
          python3 - <<'PY'
          from pathlib import Path
          p = Path("GematriaLabAndroid/app/src/main/assets/index.html")
          s = p.read_text()
          js = s.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/gematrialab-inline.js").write_text(js)
          assert 'value="Love"' not in s
          assert 'placeholder=""' in s
          assert "MULTI-DATE CALCULATOR" in s
          PY
          node --check /tmp/gematrialab-inline.js

      - name: Final palette and multi-date defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("GematriaLabAndroid/app/src/main/assets/index.html")
          s = p.read_text()
          target = "initializeMultiDates(today);"
          assert target in s
          s = s.replace(target, target + "multiDates.push({id:nextMultiDateId++,value:today});renderMultiDateInputs();renderMultiDates();", 1)
          palette = """
          /* Classic Gematrinator-style cipher color rotation */
          .cipher-display-item:nth-child(10n+1){border-left-color:#43cc73}.cipher-display-item:nth-child(10n+1) .value{color:#54dd7e}
          .cipher-display-item:nth-child(10n+2){border-left-color:#648cff}.cipher-display-item:nth-child(10n+2) .value{color:#83a5ff}
          .cipher-display-item:nth-child(10n+3){border-left-color:#d77acb}.cipher-display-item:nth-child(10n+3) .value{color:#e69adb}
          .cipher-display-item:nth-child(10n+4){border-left-color:#e4c13b}.cipher-display-item:nth-child(10n+4) .value{color:#f2d55f}
          .cipher-display-item:nth-child(10n+5){border-left-color:#36c2d5}.cipher-display-item:nth-child(10n+5) .value{color:#62d5e2}
          .cipher-display-item:nth-child(10n+6){border-left-color:#e38d4f}.cipher-display-item:nth-child(10n+6) .value{color:#f2a66c}
          .cipher-display-item:nth-child(10n+7){border-left-color:#a587e8}.cipher-display-item:nth-child(10n+7) .value{color:#c1a8ff}
          .cipher-display-item:nth-child(10n+8){border-left-color:#d96d75}.cipher-display-item:nth-child(10n+8) .value{color:#ee8c94}
          .cipher-display-item:nth-child(10n+9){border-left-color:#67bfa1}.cipher-display-item:nth-child(10n+9) .value{color:#8ed7b8}
          .cipher-display-item:nth-child(10n){border-left-color:#c7d1d7}.cipher-display-item:nth-child(10n) .value{color:#e1eaee}
          """
          s = s.replace("</style>", palette + "\n</style>", 1)
          js = s.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/gematrialab-inline.js").write_text(js)
          p.write_text(s)
          PY
          node --check /tmp/gematrialab-inline.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: GematriaLabAndroid
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          test -s GematriaLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh GematriaLabAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GematriaLab-debug-apk
          path: GematriaLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
