name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble, verify and extract project
        run: |
          cat source-part-*.b64 > source.tar.xz.b64
          test "$(wc -c < source.tar.xz.b64)" -eq 22348
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "72bc666af6e59770ac6438b8b2eab5c3cd66b19ebd780a05293ca5dfbf8cdcf7  source.tar.xz" | sha256sum -c -
          tar -xJf source.tar.xz
          test -f GematriaLabAndroid/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: GematriaLabAndroid
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          test -s GematriaLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh GematriaLabAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GematriaLab-debug-apk
          path: GematriaLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
